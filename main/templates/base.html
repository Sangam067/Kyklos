
{% if messages %}
  <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; max-width: 380px;">
    {% for message in messages %}
      <div class="kyklos-toast" style="background: rgba(15, 32, 39, 0.95); color: #22d3ee; padding: 14px 18px; border-radius: 10px; border: 1px solid #06b6d4; box-shadow: 0 10px 25px rgba(0,0,0,0.5); backdrop-filter: blur(10px); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; animation: slideIn 0.3s ease;">
        <span>{{ message }}</span>
        <button onclick="this.parentElement.remove()" style="background: none; border: none; color: #22d3ee; font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1;">&times;</button>
      </div>
    {% endfor %}
  </div>
  <style>
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
  <script>
    setTimeout(function() {
      const container = document.getElementById('toast-container');
      if (container) {
        container.style.transition = 'opacity 0.5s ease';
        container.style.opacity = '0';
        setTimeout(() => container.remove(), 500);
      }
    }, 4500);
  </script>
{% endif %}
{% block content %}

{% endblock content %}
