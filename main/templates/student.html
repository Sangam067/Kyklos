{% extends "base.html" %}


<!DOCTYPE html>
<html lang="en">
    {% block content %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Complaints Portal</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #008B8B 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid #00FFFF;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2),
                       inset 0 0 20px rgba(0, 255, 255, 0.1);
            width: 80%;
            max-width: 600px;
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #00FFFF;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            font-size: 2.5em;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        input, textarea, select {
            padding: 1rem;
            border: 2px solid #008B8B;
            border-radius: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #00FFFF;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        select {
            cursor: pointer;
        }

        select option {
            background-color: #000;
            color: white;
        }

        button {
            padding: 1rem;
            background-color: #008B8B;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: #00FFFF;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Complaints Portal</h1>
        <form method="post" action="/complaintsubmit{{hostelid}}/">
            <input type="text" placeholder="Room No " name = "roomno" required>
            <input type="text" placeholder="Your Name" name="studentname" required>
            <input type="text" placeholder="Priority" name = "priority" required><Br>
                <input type="file" id="fileInput" accept="image/*">

                <!-- Webcam Capture -->
                <video id="video" autoplay style="display: none;"></video>
                <button id="useCamera">Use Camera</button>
                <button id="capture" style="display: none;">Capture</button>
                <canvas id="canvas" style="display: none;"></canvas>
                <p id="status"></p>
                <select required name = "type">
                <option value="">Select Category</option>
                <option value="maintenance">Maintenance</option>
                <option value="cleanliness">Cleanliness</option>
                <option value="food">Food Quality</option>
                <option value="security">Security</option>
                <option value="other">Other</option>
            </select>
            <textarea name="description" placeholder="Describe your complaint or review here..." required></textarea>
            <button id = "formSubmit" type="submit">Submit Complaint</button>
        </form>
       
    </div>
    <script>
        const fileInput = document.getElementById('fileInput');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const useCameraBtn = document.getElementById('useCamera');
        const captureBtn = document.getElementById('capture');
        const form = document.querySelector('form');
        let stream;
    
        // Start camera if available
        useCameraBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.style.display = 'block';
                captureBtn.style.display = 'block';
                useCameraBtn.style.display = 'none';
            } catch (error) {
                alert("Camera access denied or unavailable.");
            }
        });
    
        // Capture image from webcam
        captureBtn.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Convert canvas to file (ONLY updates file input, DOES NOT submit form)
            canvas.toBlob(blob => {
                const file = new File([blob], "captured_image.png", { type: "image/png" });
    
                // Create a DataTransfer object to inject the file into the file input
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                fileInput.files = dataTransfer.files;
    
                video.style.display = 'none';
                captureBtn.style.display = 'none';
                useCameraBtn.style.display = 'block';
                stream.getTracks().forEach(track => track.stop()); // Stop camera
            }, "image/png");
        });
    
        // Submit form ONLY when "Submit Complaint" is clicked
        form.addEventListener('submit', function (event) {
            event.preventDefault();
    
            if (fileInput.files.length === 0) {
                alert("Please select or capture an image first.");
                return;
            }
    
            const formData = new FormData(form);
            formData.append('image', fileInput.files[0]);
    
            fetch('/complaintsubmit{{hostelid}}/', {
                method: 'POST',
                body: formData,
                headers: { 'X-CSRFToken': '{{ csrf_token }}' }
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('status').innerText = data.message;
                form.reset(); // Clear form after submission
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
{% endblock content %} 
</html>
